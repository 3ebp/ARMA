<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель в HTML</title>
    
    <!-- 1. Подключаем библиотеку model-viewer -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        /* Задаем размеры контейнера для 3D-модели */
        model-viewer {
            width: 100%;
            height: 960px;
            background-color: #ffffff;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Офис Арма</h1>

    <div class="controls">
    <button id="toggle-btn">Перейти на 2 этаж</button>
    </div>
    
    <!-- 2. Выводим GLB модель -->
    <model-viewer 
        id="viewer"
        src="3floor.glb" 
        alt="3 этаж"
         camera-controls
        min-camera-orbit="auto auto 0m"
        min-field-of-view="0deg"
        environment-image="neutral"
        shadow-intensity="1"
        shadow-softness="1"
        auto-rotate
        touch-action="pan-y"
        camera-controls>
    </model-viewer>
     
 

    <script>
        const viewer = document.getElementById('viewer');
        const button = document.getElementById('toggle-btn');

        // Пути к вашим файлам
        const model1 = "3floor.glb";
        const model2 = "2floor.glb";

        button.addEventListener('click', () => {
            // Проверяем, какая модель сейчас загружена, и меняем атрибут src
            if (viewer.getAttribute('src') === model1) {
                viewer.setAttribute('src', model2);
                button.textContent = "Перейти на 3 этаж";
            } else {
                viewer.setAttribute('src', model1);
                button.textContent = "Перейти на 2 этаж";
            }
        });
    </script>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</body>
</html>
