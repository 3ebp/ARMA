<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель в HTML</title>
    
    <!-- 1. Подключаем библиотеку model-viewer -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        /* Задаем размеры контейнера для 3D-модели */
        model-viewer {
            width: 70%;
            height: 720px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Офис Арма. 3 этаж</h1>

    <!-- 2. Выводим GLB модель -->
    <model-viewer 
        src="model.glb" 
        alt="3 этаж"
        environment-image="neutral"
        shadow-intensity="1"
        shadow-softness="1"
        auto-rotate
        touch-action="pan-y"
        camera-controls>
    </model-viewer>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</body>
</html>
